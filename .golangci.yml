run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - bodyclose
    - misspell
    - revive
    - gosec
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/novapanel
  revive:
    rules:
      - name: exported
        disabled: true
  gosec:
    excludes:
      - G401
      - G505

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
